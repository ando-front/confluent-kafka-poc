# =============================================================================
# confluent-kafka-poc — MINIMAL local stack
# -----------------------------------------------------------------------------
# ZooKeeper + Kafka broker + kafka-ui only. Fastest way to get a broker up for
# quick iteration. No Schema Registry / Connect / Control Center.
#
# Start:  docker compose -f docker/docker-compose.minimal.yml up -d
#         (or ./scripts/start.sh minimal)
# =============================================================================

networks:
  kafka-network:
    driver: bridge

volumes:
  zookeeper-data-min:
  kafka-data-min:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: poc-zookeeper-min
    networks: [kafka-network]
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data-min:/var/lib/zookeeper/data
    healthcheck:
      # cp-zookeeper 7.x が許可する 4lw コマンドは srvr のみ（ruok はブロックされる）。
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10

  broker:
    image: confluentinc/cp-kafka:7.5.0
    hostname: broker
    container_name: poc-broker-min
    networks: [kafka-network]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data-min:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "broker:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: poc-kafka-ui-min
    networks: [kafka-network]
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: poc-local-minimal
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker:29092"
      DYNAMIC_CONFIG_ENABLED: "true"
