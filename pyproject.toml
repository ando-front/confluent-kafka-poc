[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confluent-kafka-poc"
version = "0.1.0"
description = "Apache Kafka / Confluent Platform PoC foundation — 7 ready-to-run use cases."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Confluent PoC Team" }]
dependencies = [
    "confluent-kafka[avro,schemaregistry]==2.5.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "rich==13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "mypy==1.13.0",
    "ruff==0.7.4",
]

[tool.setuptools]
# Source-layout: core is an importable package; use_cases/benchmarks are scripts.
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: tests that require a running Kafka broker",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
