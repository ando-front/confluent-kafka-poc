<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img">
  <rect width="1160" height="560" fill="#FFFFFF"/>
  <text x="46.0" y="33.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="19" fill="#13212A" font-weight="bold" font-style="normal">配信保証の 3 レベル — 「送ったあと ack が返らなかったら、どうするか」の違い</text>
  <text x="46.0" y="56.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#5C7178" font-weight="normal" font-style="normal">このリポジトリの既定は At-Least-Once。Exactly-Once は use_cases/06 で明示的に選んだときだけ。</text>
  <rect x="40.0" y="90.0" width="340.0" height="330.0" rx="6.0" fill="#FBFDFD" stroke="#BFD0D2" stroke-width="1"/>
  <text x="46.0" y="106.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="bold" font-style="normal">At-Most-Once　多くても 1 回</text>
  <rect x="60.0" y="134.0" width="300.0" height="40.0" rx="4.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="210.0" y="155.9" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">送る → ack を待たない</text>
  <rect x="60.0" y="194.0" width="300.0" height="52.0" rx="4.0" fill="#F8E0E0" stroke="#B44A4A" stroke-width="1"/>
  <text x="210.0" y="214.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A2727" font-weight="normal" font-style="normal">途中で落ちたら</text>
  <text x="210.0" y="229.3" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A2727" font-weight="normal" font-style="normal">そのメッセージは消える</text>
  <rect x="60.0" y="266.0" width="300.0" height="70.0" rx="4.0" fill="#FFFFFF" stroke="#C3D2D4" stroke-width="1"/>
  <text x="66.0" y="288.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">重複　なし</text>
  <text x="66.0" y="302.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">消失　あり</text>
  <text x="66.0" y="317.8" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">速度　いちばん速い</text>
  <text x="66.0" y="363.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">使いどころ：多少欠けてもよいアクセスログ、</text>
  <text x="66.0" y="378.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">メトリクスの間引きサンプリング。</text>
  <rect x="410.0" y="90.0" width="340.0" height="330.0" rx="6.0" fill="#FBFDFD" stroke="#0B7A84" stroke-width="1"/>
  <text x="416.0" y="106.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#0A3F45" font-weight="bold" font-style="normal">At-Least-Once　少なくとも 1 回　★ 既定</text>
  <rect x="430.0" y="134.0" width="300.0" height="40.0" rx="4.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="580.0" y="155.9" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">送る → ack を待つ → 返らなければ再送</text>
  <rect x="430.0" y="194.0" width="300.0" height="52.0" rx="4.0" fill="#F7E9D4" stroke="#B07A28" stroke-width="1"/>
  <text x="580.0" y="214.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">ack だけ落ちた場合、</text>
  <text x="580.0" y="229.3" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">同じものが 2 回届くことがある</text>
  <rect x="430.0" y="266.0" width="300.0" height="70.0" rx="4.0" fill="#FFFFFF" stroke="#0B7A84" stroke-width="1"/>
  <text x="436.0" y="288.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">重複　あり</text>
  <text x="436.0" y="302.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">消失　なし</text>
  <text x="436.0" y="317.8" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">速度　実用上いちばんバランスがよい</text>
  <text x="436.0" y="363.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0B7A84" font-weight="normal" font-style="normal">使いどころ：通知・分析・ほとんどの業務処理。</text>
  <text x="436.0" y="378.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0B7A84" font-weight="normal" font-style="normal">受け手を冪等（同じ ID は 2 回処理しない）にして</text>
  <text x="436.0" y="393.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0B7A84" font-weight="normal" font-style="normal">重複に耐える、が定石。</text>
  <rect x="780.0" y="90.0" width="340.0" height="330.0" rx="6.0" fill="#FBFDFD" stroke="#1F7A5C" stroke-width="1"/>
  <text x="786.0" y="106.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#14513D" font-weight="bold" font-style="normal">Exactly-Once　ちょうど 1 回</text>
  <rect x="800.0" y="134.0" width="300.0" height="40.0" rx="4.0" fill="#DCF0E7" stroke="#1F7A5C" stroke-width="1"/>
  <text x="950.0" y="155.9" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">トランザクション + 受信側の冪等台帳</text>
  <rect x="800.0" y="194.0" width="300.0" height="52.0" rx="4.0" fill="#DCF0E7" stroke="#1F7A5C" stroke-width="1"/>
  <text x="950.0" y="214.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">再送されても、受信側が</text>
  <text x="950.0" y="229.3" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">処理済み ID を見て弾く</text>
  <rect x="800.0" y="266.0" width="300.0" height="70.0" rx="4.0" fill="#FFFFFF" stroke="#1F7A5C" stroke-width="1"/>
  <text x="806.0" y="288.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">重複　なし</text>
  <text x="806.0" y="302.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">消失　なし</text>
  <text x="806.0" y="317.8" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">速度　いちばん遅い（調整のコスト）</text>
  <text x="806.0" y="363.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">使いどころ：金融・課金・在庫引き当てなど、</text>
  <text x="806.0" y="378.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">二重処理が事故になる領域だけ。</text>
  <text x="806.0" y="393.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">→ offset 14 / use_cases/06</text>
  <rect x="40.0" y="448.0" width="1080.0" height="70.0" rx="6.0" fill="#F4F8F8" stroke="#BFD0D2" stroke-width="1"/>
  <text x="46.0" y="477.0" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">選び方の基準は「速度」ではなく「事故になるか」。二重処理が事故にならない領域に Exactly-Once を持ち込むと、</text>
  <text x="46.0" y="493.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">得られるものより失う速度のほうが大きい。</text>
</svg>
