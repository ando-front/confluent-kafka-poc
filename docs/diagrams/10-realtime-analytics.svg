  <polygon points="640.0,180.0 631.0,176.2 631.0,183.8" fill="#0B7A84" stroke="none"/>
  <path d="M790.0 260.0 L790.0 290.0 L740.0 290.0 L740.0 320.0" fill="none" stroke="#0B7A84" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="740.0,320.0 743.8,311.0 736.2,311.0" fill="#0B7A84" stroke="none"/>
  <path d="M840.0 360.0 L890.0 360.0" fill="none" stroke="#1F7A5C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="890.0,360.0 881.0,356.2 881.0,363.8" fill="#1F7A5C" stroke="none"/>
  <rect x="40.0" y="450.0" width="1080.0" height="76.0" rx="6.0" fill="#F4F8F8" stroke="#BFD0D2" stroke-width="1"/>
  <text x="46.0" y="482.0" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">段を分けておくと、ダッシュボードを止めても集計は続き、集計を作り直しても生イベントは失われない。</text>
  <text x="46.0" y="498.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">あとから「別の切り口の集計」を足すのも、analytics.events.v1 を読む新しいプロセスを 1 つ増やすだけ。</text>
