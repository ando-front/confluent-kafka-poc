  <text x="46.0" y="102.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="bold" font-style="normal">① タンブリングウィンドウ集計 — 30 秒ごとに区切って売上を合計する</text>
  <rect x="64.0" y="132.0" width="200.0" height="52.0" rx="6.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
