  <text x="781.0" y="167.3" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#5C7178" font-weight="normal" font-style="normal">集計中…</text>
  <text x="346.0" y="202.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">ウィンドウは重ならない（タンブリング）。境界をまたぐイベントは次のウィンドウへ。</text>
