  <rect x="40.0" y="510.0" width="1080.0" height="54.0" rx="6.0" fill="#F4F8F8" stroke="#BFD0D2" stroke-width="1"/>
  <text x="46.0" y="539.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">「いまの状態」はイベントを畳み込んだ結果にすぎない。どこで止めるかを変えるだけで、過去の任意の時点を復元できる。</text>
