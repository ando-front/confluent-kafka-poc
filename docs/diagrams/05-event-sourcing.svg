  <rect x="330.0" y="414.0" width="220.0" height="60.0" rx="6.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="440.0" y="445.9" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">offset 0 〜 1 で止める</text>
