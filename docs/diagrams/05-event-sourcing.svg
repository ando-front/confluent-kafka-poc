  <text x="995.0" y="453.4" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="bold" font-style="normal">status = PAID</text>
