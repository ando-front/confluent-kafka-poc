<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640" role="img">
  <rect width="1160" height="640" fill="#FFFFFF"/>
  <text x="46.0" y="33.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="19" fill="#13212A" font-weight="bold" font-style="normal">Confluent Cloud への切り替え — 変わるのは .env だけ</text>
  <text x="46.0" y="56.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#5C7178" font-weight="normal" font-style="normal">core/config.py が .env から接続設定を読むので、use_cases 側のコードは 1 行も変えずに接続先を差し替えられる。</text>
  <rect x="40.0" y="90.0" width="330.0" height="240.0" rx="6.0" fill="#FBFDFD" stroke="#BFD0D2" stroke-width="1"/>
  <text x="46.0" y="106.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="bold" font-style="normal">アプリケーション側（変わらない）</text>
  <rect x="64.0" y="134.0" width="282.0" height="46.0" rx="6.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="205.0" y="158.9" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">use_cases/01〜07</text>
  <rect x="64.0" y="192.0" width="282.0" height="46.0" rx="6.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="205.0" y="216.9" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">core/　BaseProducer · BaseConsumer</text>
  <rect x="64.0" y="250.0" width="282.0" height="46.0" rx="6.0" fill="#F7E9D4" stroke="#B07A28" stroke-width="1"/>
  <text x="205.0" y="274.9" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="bold" font-style="normal">core/config.py　Settings</text>
  <path d="M205.0 180.0 L205.0 192.0" fill="none" stroke="#5C7178" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="205.0,192.0 208.8,183.0 201.2,183.0" fill="#5C7178" stroke="none"/>
  <path d="M205.0 238.0 L205.0 250.0" fill="none" stroke="#5C7178" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="205.0,250.0 208.8,241.0 201.2,241.0" fill="#5C7178" stroke="none"/>
  <rect x="420.0" y="90.0" width="340.0" height="180.0" rx="6.0" fill="#FFFFFF" stroke="#0B7A84" stroke-width="1"/>
  <text x="426.0" y="106.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#0A3F45" font-weight="bold" font-style="normal">KAFKA_ENV=local　（既定）</text>
  <text x="446.0" y="145.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#5C7178" font-weight="normal" font-style="normal">KAFKA_BOOTSTRAP_SERVERS=localhost:9092</text>
  <text x="446.0" y="160.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#5C7178" font-weight="normal" font-style="normal">KAFKA_SECURITY_PROTOCOL=PLAINTEXT</text>
  <text x="446.0" y="175.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#5C7178" font-weight="normal" font-style="normal">（認証なし）</text>
  <text x="446.0" y="221.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">Docker が手元に立っているだけ。</text>
  <text x="446.0" y="236.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">壊しても ./scripts/reset.sh で作り直せる。</text>
  <rect x="420.0" y="300.0" width="340.0" height="230.0" rx="6.0" fill="#FFFFFF" stroke="#B07A28" stroke-width="1"/>
  <text x="426.0" y="316.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#6B4A12" font-weight="bold" font-style="normal">KAFKA_ENV=confluent</text>
  <text x="446.0" y="355.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">KAFKA_BOOTSTRAP_SERVERS=</text>
  <text x="446.0" y="370.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">pkc-xxx.aws.confluent.cloud:9092</text>
  <text x="446.0" y="385.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">KAFKA_SECURITY_PROTOCOL=SASL_SSL</text>
  <text x="446.0" y="399.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">KAFKA_SASL_MECHANISM=PLAIN</text>
  <text x="446.0" y="414.8" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">KAFKA_SASL_USERNAME=</text>
  <text x="446.0" y="429.6" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">KAFKA_SASL_PASSWORD=</text>
  <text x="446.0" y="481.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#B44A4A" font-weight="normal" font-style="normal">API キーは .env に置く。</text>
  <text x="446.0" y="496.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#B44A4A" font-weight="normal" font-style="normal">.env は .gitignore 済み — コミットしない。</text>
  <rect x="810.0" y="110.0" width="310.0" height="140.0" rx="6.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="965.0" y="165.9" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#0A3F45" font-weight="normal" font-style="normal">ローカル Docker</text>
  <text x="965.0" y="182.1" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#0A3F45" font-weight="normal" font-style="normal">ZooKeeper + Broker + UI</text>
  <text x="965.0" y="198.3" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#0A3F45" font-weight="normal" font-style="normal">自分で起動・停止・削除する</text>
  <rect x="810.0" y="330.0" width="310.0" height="170.0" rx="6.0" fill="#F7E9D4" stroke="#B07A28" stroke-width="1"/>
  <text x="965.0" y="392.8" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#6B4A12" font-weight="normal" font-style="normal">Confluent Cloud</text>
  <text x="965.0" y="409.0" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#6B4A12" font-weight="normal" font-style="normal">マネージドクラスター</text>
  <text x="965.0" y="425.2" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#6B4A12" font-weight="normal" font-style="normal">起動・冗長化・パッチは向こう持ち</text>
  <text x="965.0" y="441.4" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#6B4A12" font-weight="normal" font-style="normal">（従量課金・認証必須）</text>
  <path d="M370.0 262.8 L395.0 262.8 L395.0 153.0 L420.0 153.0" fill="none" stroke="#B07A28" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="420.0,153.0 411.0,149.2 411.0,156.8" fill="#B07A28" stroke="none"/>
  <path d="M370.0 294.0 L395.0 294.0 L395.0 369.0 L420.0 369.0" fill="none" stroke="#B07A28" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
  <polygon points="420.0,369.0 411.0,365.2 411.0,372.8" fill="#B07A28" stroke="none"/>
  <path d="M760.0 162.0 L785.0 162.0 L785.0 180.0 L810.0 180.0" fill="none" stroke="#0B7A84" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="810.0,180.0 801.0,176.2 801.0,183.8" fill="#0B7A84" stroke="none"/>
  <path d="M760.0 392.0 L785.0 392.0 L785.0 415.0 L810.0 415.0" fill="none" stroke="#B07A28" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="810.0,415.0 801.0,411.2 801.0,418.8" fill="#B07A28" stroke="none"/>
  <rect x="40.0" y="552.0" width="1080.0" height="70.0" rx="6.0" fill="#F4F8F8" stroke="#BFD0D2" stroke-width="1"/>
  <text x="46.0" y="581.0" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">学習の要点：接続設定を 1 か所に閉じ込めておくと、ローカルで作ったものがそのままマネージドサービスで動く。</text>
  <text x="46.0" y="597.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">逆に接続情報をコードに散らすと、この差し替えができなくなる。</text>
  <rect x="397.1" y="187.1" width="63.8" height="17.5" rx="2" fill="#FFFFFF" stroke="none"/>
  <text x="429.0" y="197.6" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#B07A28" font-weight="normal" font-style="normal">どちらか一方を読む</text>
</svg>
