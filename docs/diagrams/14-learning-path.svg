<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img">
  <rect width="1160" height="560" fill="#FFFFFF"/>
  <text x="46.0" y="33.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="19" fill="#13212A" font-weight="bold" font-style="normal">学習ロードマップ — 19 ステップの全体像</text>
  <text x="46.0" y="56.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#5C7178" font-weight="normal" font-style="normal">いま自分がどこにいるかを見失ったら、この図に戻る。前のフェーズが通っていないと次は必ず詰まる。</text>
  <rect x="40.0" y="90.0" width="250.0" height="330.0" rx="6.0" fill="#FBFDFD" stroke="#BFD0D2" stroke-width="1"/>
  <text x="46.0" y="106.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="bold" font-style="normal">Phase 1　理解する　offset 01–02　読むだけ・30 分</text>
  <rect x="56.0" y="136.0" width="218.0" height="38.0" rx="4.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="62.0" y="156.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">01　Kafka が解く問題</text>
  <rect x="56.0" y="184.0" width="218.0" height="38.0" rx="4.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="62.0" y="204.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">02　5 つの言葉</text>
  <text x="62.0" y="251.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">ここを飛ばすとログが読めず、</text>
  <text x="62.0" y="266.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">以降ずっと勘で進むことになる。</text>
  <text x="62.0" y="295.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">図解：</text>
  <text x="62.0" y="310.8" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">・Kafka 全体像</text>
  <text x="62.0" y="325.6" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">・Topic / Partition / Offset</text>
  <text x="62.0" y="340.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">・Consumer Group</text>
  <text x="62.0" y="355.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">・配信保証の 3 レベル</text>
  <rect x="320.0" y="90.0" width="250.0" height="330.0" rx="6.0" fill="#FBFDFD" stroke="#BFD0D2" stroke-width="1"/>
  <text x="326.0" y="106.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="bold" font-style="normal">Phase 2　環境をつくる　offset 03–07　40 分</text>
  <rect x="336.0" y="136.0" width="218.0" height="34.0" rx="4.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="342.0" y="154.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">03　前提ツールを揃える</text>
