  <text x="46.0" y="495.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">09 / 10 / 12 / 13 は「その形が必要になったときに戻ってくる」章として置いてある。</text>
