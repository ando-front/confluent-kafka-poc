  <text x="622.0" y="153.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">08　Pub/Sub の基本</text>
  <rect x="616.0" y="174.0" width="218.0" height="32.0" rx="4.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="622.0" y="191.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">09　イベントソーシング</text>
  <rect x="616.0" y="212.0" width="218.0" height="32.0" rx="4.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="622.0" y="229.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">10　CDC</text>
  <rect x="616.0" y="250.0" width="218.0" height="32.0" rx="4.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="622.0" y="267.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">11　Dead Letter Queue</text>
  <rect x="616.0" y="288.0" width="218.0" height="32.0" rx="4.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="622.0" y="305.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">12　リアルタイム KPI</text>
  <rect x="616.0" y="326.0" width="218.0" height="32.0" rx="4.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="622.0" y="343.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">13　ストリーム処理</text>
  <rect x="616.0" y="364.0" width="218.0" height="32.0" rx="4.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="622.0" y="381.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">14　Exactly-Once</text>
  <rect x="880.0" y="90.0" width="240.0" height="330.0" rx="6.0" fill="#FBFDFD" stroke="#1F7A5C" stroke-width="1"/>
  <text x="886.0" y="106.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#14513D" font-weight="bold" font-style="normal">Phase 4　運用する　offset 15–19</text>
  <rect x="896.0" y="136.0" width="208.0" height="34.0" rx="4.0" fill="#DCF0E7" stroke="#1F7A5C" stroke-width="1"/>
