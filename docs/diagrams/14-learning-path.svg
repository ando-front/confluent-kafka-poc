  <rect x="896.0" y="178.0" width="208.0" height="34.0" rx="4.0" fill="#DCF0E7" stroke="#1F7A5C" stroke-width="1"/>
  <text x="902.0" y="196.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">16　性能を測る</text>
  <rect x="896.0" y="220.0" width="208.0" height="34.0" rx="4.0" fill="#DCF0E7" stroke="#1F7A5C" stroke-width="1"/>
  <text x="902.0" y="238.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">17　自力で直す</text>
  <rect x="896.0" y="262.0" width="208.0" height="34.0" rx="4.0" fill="#DCF0E7" stroke="#1F7A5C" stroke-width="1"/>
  <text x="902.0" y="280.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">18　Confluent Cloud</text>
  <rect x="896.0" y="304.0" width="208.0" height="34.0" rx="4.0" fill="#1F7A5C" stroke="#1F7A5C" stroke-width="1"/>
  <text x="902.0" y="322.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold" font-style="normal">19　卒業課題：自作する</text>
  <text x="902.0" y="367.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">図解：切り分けフロー / Confluent Cloud</text>
