  <text x="342.0" y="196.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">04　Python 環境</text>
  <rect x="336.0" y="220.0" width="218.0" height="34.0" rx="4.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="342.0" y="238.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">05　.env を置く</text>
  <rect x="336.0" y="262.0" width="218.0" height="34.0" rx="4.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="342.0" y="280.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="bold" font-style="normal">06　Kafka を起動する</text>
  <rect x="336.0" y="304.0" width="218.0" height="34.0" rx="4.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="342.0" y="322.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">07　kafka-ui で中を覗く</text>
  <text x="342.0" y="367.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A8F97" font-weight="normal" font-style="normal">図解：ローカル環境の構成</text>
