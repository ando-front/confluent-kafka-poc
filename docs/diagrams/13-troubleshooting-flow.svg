<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img">
  <rect width="1160" height="760" fill="#FFFFFF"/>
  <text x="46.0" y="33.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="19" fill="#13212A" font-weight="bold" font-style="normal">詰まったときの切り分けフロー</text>
  <text x="46.0" y="56.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#5C7178" font-weight="normal" font-style="normal">エラーメッセージを読む前に、まず「どの層で止まっているか」を上から順に確かめる。</text>
  <rect x="60.0" y="100.0" width="220.0" height="44.0" rx="20.0" fill="#13212A" stroke="#13212A" stroke-width="1"/>
  <text x="170.0" y="124.1" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" font-style="normal">デモが動かない</text>
  <polygon points="170.0,180.0 280.0,225.0 170.0,270.0 60.0,225.0" fill="#FFFFFF" stroke="#0B7A84" stroke-width="1"/>
  <text x="170.0" y="219.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">docker ps で</text>
  <text x="170.0" y="234.3" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">コンテナは Up ?</text>
  <rect x="380.0" y="192.0" width="360.0" height="66.0" rx="6.0" fill="#F7E9D4" stroke="#B07A28" stroke-width="1"/>
  <text x="386.0" y="219.5" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">./scripts/start.sh</text>
  <text x="386.0" y="234.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">Docker Desktop 自体が起動しているかも確認する</text>
  <polygon points="170.0,306.0 280.0,351.0 170.0,396.0 60.0,351.0" fill="#FFFFFF" stroke="#0B7A84" stroke-width="1"/>
  <text x="170.0" y="345.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">Kafka is ready まで</text>
  <text x="170.0" y="360.4" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">到達する ?</text>
  <rect x="380.0" y="318.0" width="470.0" height="66.0" rx="6.0" fill="#F7E9D4" stroke="#B07A28" stroke-width="1"/>
  <text x="386.0" y="345.5" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">docker compose -f docker/docker-compose.yml logs broker --tail 50</text>
  <text x="386.0" y="360.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">初回はイメージ取得で時間がかかる。ポート競合なら lsof -i :9092</text>
  <polygon points="170.0,432.0 280.0,477.0 170.0,522.0 60.0,477.0" fill="#FFFFFF" stroke="#0B7A84" stroke-width="1"/>
  <text x="170.0" y="471.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">python が</text>
  <text x="170.0" y="486.4" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">モジュールを見つける ?</text>
  <rect x="380.0" y="444.0" width="470.0" height="66.0" rx="6.0" fill="#F7E9D4" stroke="#B07A28" stroke-width="1"/>
  <text x="386.0" y="471.5" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">pip install -r requirements.txt</text>
  <text x="386.0" y="486.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">pip -V で Python 3.11+ を指しているか確認する（venv の入れ違いが多い）</text>
  <polygon points="170.0,558.0 280.0,603.0 170.0,648.0 60.0,603.0" fill="#FFFFFF" stroke="#0B7A84" stroke-width="1"/>
  <text x="170.0" y="597.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">メッセージが</text>
  <text x="170.0" y="612.4" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">届いている ?</text>
  <rect x="380.0" y="552.0" width="470.0" height="100.0" rx="6.0" fill="#F7E9D4" stroke="#B07A28" stroke-width="1"/>
  <text x="386.0" y="581.6" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">kafka-ui（localhost:8080）でトピックと lag を見る</text>
  <text x="386.0" y="596.5" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">・コンシューマーが無反応 → 正常。別ターミナルでプロデューサーを動かす</text>
  <text x="386.0" y="611.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">・最初から読み直したい → --group を新しい名前にする</text>
  <text x="386.0" y="626.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">・同じものを何度も受信する → 受け手を冪等にする（offset 14）</text>
  <rect x="60.0" y="676.0" width="220.0" height="60.0" rx="6.0" fill="#DCF0E7" stroke="#1F7A5C" stroke-width="1"/>
  <text x="170.0" y="700.0" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#14513D" font-weight="bold" font-style="normal">ここまで通れば環境は健全。</text>
  <text x="170.0" y="716.2" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#14513D" font-weight="bold" font-style="normal">あとはユースケース個別の問題。</text>
  <rect x="890.0" y="676.0" width="230.0" height="60.0" rx="6.0" fill="#F8E0E0" stroke="#B44A4A" stroke-width="1"/>
  <text x="896.0" y="693.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A2727" font-weight="normal" font-style="normal">最後の手段</text>
  <text x="896.0" y="707.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A2727" font-weight="normal" font-style="normal">./scripts/reset.sh &amp;&amp; ./scripts/start.sh</text>
  <text x="896.0" y="722.8" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A2727" font-weight="normal" font-style="normal">（トピックのデータは全部消える。実験をやり直したいときに使う）</text>
  <rect x="890.0" y="180.0" width="230.0" height="200.0" rx="6.0" fill="#FBFDFD" stroke="#0B7A84" stroke-width="1"/>
  <text x="896.0" y="195.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">まず打つ 3 コマンド</text>
  <text x="896.0" y="225.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">docker ps</text>
  <text x="896.0" y="239.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">./scripts/start.sh</text>
  <text x="896.0" y="254.8" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">pytest tests/ -v</text>
  <text x="896.0" y="284.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">この 3 つが通るかどうかで、</text>
  <text x="896.0" y="299.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">問題が「環境」なのか「コード」なのかが分かれる。</text>
