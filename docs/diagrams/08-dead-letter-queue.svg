  <text x="660.0" y="429.4" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#6B4A12" font-weight="normal" font-style="normal">一時的な失敗ならここで復帰する</text>
  <rect x="290.0" y="384.0" width="200.0" height="72.0" rx="6.0" fill="#F8E0E0" stroke="#B44A4A" stroke-width="1"/>
