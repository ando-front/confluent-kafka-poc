  <rect x="40.0" y="504.0" width="1080.0" height="76.0" rx="6.0" fill="#F4F8F8" stroke="#BFD0D2" stroke-width="1"/>
  <text x="46.0" y="536.0" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">肝は「失敗を捨てない」こと。DLQ に退避すればメインの処理は止まらず、あとから中身を見て直せる。</text>
  <text x="46.0" y="552.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">--bad-rate 1.0 で全件失敗、0.0 で全件成功。壊れ方の割合を変えて挙動を確かめる。</text>
