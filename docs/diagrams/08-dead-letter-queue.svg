  <text x="140.0" y="165.3" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">20% の不正メッセージを混ぜて送る</text>
  <rect x="300.0" y="132.0" width="180.0" height="48.0" rx="6.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
