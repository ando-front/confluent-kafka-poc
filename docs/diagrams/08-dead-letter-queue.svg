  <text x="46.0" y="56.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#5C7178" font-weight="normal" font-style="normal">use_cases/05_dead_letter_queue　--bad-rate で不正メッセージの割合を変えて挙動を確かめる</text>
