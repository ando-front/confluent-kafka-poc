  <text x="390.0" y="429.4" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A2727" font-weight="bold" font-style="normal">失敗理由と試行回数を添えて退避</text>
  <rect x="40.0" y="384.0" width="200.0" height="72.0" rx="6.0" fill="#FFFFFF" stroke="#B44A4A" stroke-width="1"/>
  <text x="140.0" y="414.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A2727" font-weight="normal" font-style="normal">dlq_processor.py</text>
  <text x="140.0" y="429.4" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#7A2727" font-weight="normal" font-style="normal">中身を見て復旧できるか判断する</text>
  <rect x="40.0" y="248.0" width="200.0" height="72.0" rx="6.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="140.0" y="278.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">直せるものは元トピックへ再投入</text>
  <text x="140.0" y="293.4" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">直せないものは記録して諦める</text>
