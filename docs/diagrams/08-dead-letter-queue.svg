  <text x="660.0" y="165.3" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">1 件ずつ処理する</text>
  <polygon points="660.0,240.0 760.0,283.0 660.0,326.0 560.0,283.0" fill="#FFFFFF" stroke="#0B7A84" stroke-width="1"/>
