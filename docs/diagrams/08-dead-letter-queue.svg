  <rect x="860.0" y="254.0" width="260.0" height="58.0" rx="6.0" fill="#DCF0E7" stroke="#1F7A5C" stroke-width="1"/>
  <text x="990.0" y="277.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">正常に処理して commit</text>
  <text x="990.0" y="292.4" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#14513D" font-weight="normal" font-style="normal">次のメッセージへ進む</text>
  <rect x="560.0" y="384.0" width="200.0" height="72.0" rx="6.0" fill="#F7E9D4" stroke="#B07A28" stroke-width="1"/>
