<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img">
  <rect width="1160" height="520" fill="#FFFFFF"/>
  <text x="46.0" y="33.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="19" fill="#13212A" font-weight="bold" font-style="normal">Schema Registry — 「形が変わった」を事故にしない仕組み</text>
  <text x="46.0" y="56.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#5C7178" font-weight="normal" font-style="normal">送り手と受け手が別々のタイミングでデプロイされる前提で、メッセージの形を第三者に預けておく。</text>
  <rect x="40.0" y="200.0" width="220.0" height="80.0" rx="6.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="150.0" y="234.0" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">Producer</text>
  <text x="150.0" y="250.2" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">スキーマを登録してから送る</text>
  <rect x="420.0" y="96.0" width="330.0" height="180.0" rx="6.0" fill="#FBFDFD" stroke="#0B7A84" stroke-width="1"/>
  <text x="426.0" y="112.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#0A3F45" font-weight="bold" font-style="normal">Schema Registry　:8081</text>
  <text x="426.0" y="128.4" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#0A3F45" font-weight="bold" font-style="normal">スキーマの版を管理する</text>
  <rect x="440.0" y="142.0" width="290.0" height="36.0" rx="4.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="446.0" y="161.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#13212A" font-weight="normal" font-style="normal">v1　{ order_id, amount }</text>
  <rect x="440.0" y="186.0" width="290.0" height="36.0" rx="4.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="446.0" y="205.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">v2　{ order_id, amount, coupon? }</text>
  <text x="446.0" y="246.9" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0B7A84" font-weight="normal" font-style="normal">互換性チェック：v1 の受け手が v2 を読めるか？</text>
  <rect x="420.0" y="310.0" width="330.0" height="80.0" rx="6.0" fill="#D6EDEF" stroke="#0B7A84" stroke-width="1"/>
  <text x="585.0" y="337.1" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">Topic</text>
  <text x="585.0" y="351.9" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">本文にはスキーマ ID だけが載る</text>
  <text x="585.0" y="366.8" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="11" fill="#0A3F45" font-weight="normal" font-style="normal">（形の定義そのものは毎回送らない）</text>
  <rect x="900.0" y="200.0" width="220.0" height="90.0" rx="6.0" fill="#EEF3F4" stroke="#9FB3B7" stroke-width="1"/>
  <text x="1010.0" y="230.9" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">Consumer</text>
  <text x="1010.0" y="247.1" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">ID を見てスキーマを取り寄せ、</text>
  <text x="1010.0" y="263.3" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">自分が知っている形に読み替える</text>
  <path d="M260.0 224.0 L340.0 224.0 L340.0 204.0 L420.0 204.0" fill="none" stroke="#0B7A84" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="420.0,204.0 411.0,200.2 411.0,207.8" fill="#0B7A84" stroke="none"/>
  <path d="M260.0 264.0 L340.0 264.0 L340.0 350.0 L420.0 350.0" fill="none" stroke="#5C7178" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="420.0,350.0 411.0,346.2 411.0,353.8" fill="#5C7178" stroke="none"/>
  <path d="M750.0 350.0 L825.0 350.0 L825.0 267.5 L900.0 267.5" fill="none" stroke="#5C7178" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="900.0,267.5 891.0,263.7 891.0,271.3" fill="#5C7178" stroke="none"/>
  <path d="M900.0 222.5 L825.0 222.5 L825.0 204.0 L750.0 204.0" fill="none" stroke="#0B7A84" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="750.0,204.0 759.0,207.8 759.0,200.2" fill="#0B7A84" stroke="none"/>
  <rect x="40.0" y="416.0" width="1080.0" height="70.0" rx="6.0" fill="#F4F8F8" stroke="#BFD0D2" stroke-width="1"/>
  <text x="46.0" y="445.0" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">互換性のある変更（項目を optional で足すなど）は受け手を直さなくても通る。互換性のない変更はここで弾かれる。</text>
  <text x="46.0" y="461.2" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#13212A" font-weight="normal" font-style="normal">このリポジトリでは full 構成で :8081 に立ち上がる。01〜07 のデモは JSON で動くので必須ではない。</text>
  <rect x="323.6" y="195.2" width="32.8" height="17.5" rx="2" fill="#FFFFFF" stroke="none"/>
  <text x="340.0" y="205.8" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#0B7A84" font-weight="normal" font-style="normal">① 登録</text>
  <rect x="323.6" y="288.2" width="32.8" height="17.5" rx="2" fill="#FFFFFF" stroke="none"/>
  <text x="340.0" y="298.8" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#5C7178" font-weight="normal" font-style="normal">② 送信</text>
  <rect x="808.6" y="290.0" width="32.8" height="17.5" rx="2" fill="#FFFFFF" stroke="none"/>
  <text x="825.0" y="300.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#5C7178" font-weight="normal" font-style="normal">③ 受信</text>
  <rect x="796.2" y="194.5" width="57.6" height="17.5" rx="2" fill="#FFFFFF" stroke="none"/>
  <text x="825.0" y="205.0" text-anchor="middle" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10" fill="#0B7A84" font-weight="normal" font-style="normal">④ スキーマ取得</text>
</svg>
