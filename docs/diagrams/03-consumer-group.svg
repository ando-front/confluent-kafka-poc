  <rect width="1160" height="750" fill="#FFFFFF"/>
  <text x="46.0" y="33.3" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="19" fill="#13212A" font-weight="bold" font-style="normal">Consumer Group — 同じグループなら分担、違うグループなら全員が全件</text>
  <text x="46.0" y="56.1" text-anchor="start" font-family="'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12" fill="#5C7178" font-weight="normal" font-style="normal">パーティションは 1 グループ内で必ず 1 台のコンシューマーにだけ割り当たる。これが並列度の上限になる。</text>
